<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Blood Group Detection</title>
    <style>
        /* Body with Background Image & Transparency */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: url('background.jpg') no-repeat center center/cover;
            position: relative;
            text-align: center;
            height: 100vh;
        }

        /* Adding a Transparent Overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* 50% transparent dark overlay */
            z-index: -1;
        }

        /* Navbar Styling */
        .navbar {
            background-color: rgba(100, 2, 2, 0.7);
            padding: 15px;
            display: flex;
            justify-content: space-between; /* Align items to left and right */
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        /* Left Side Navbar */
        .navbar-left {
            display: flex;
            gap: 20px; /* Spacing between buttons */
            padding-left: 20px; /* Adjust spacing */
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            padding: 10px 15px;
        }

        .navbar a:hover {
            background-color: rgba(0, 127, 142, 0.7);
            border-radius: 5px;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            width: 60%;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            color: white;
            backdrop-filter: blur(8px);
            padding: 30px;
        }

        h1, h2 {
            color: #ffeb3b;
        }

        .btn {
            background-color: rgba(3, 84, 85, 0.8);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: rgba(0, 127, 142, 0.9);
            transform: scale(1.05);
        }

    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <div class="navbar">
        <!-- Left-aligned Links -->
        <div class="navbar-left">
            <a href="#home">Home</a>
            <a href="index.html">Sign In</a>
        </div>
    </div>

    <!-- Home Section -->
    <div class="container" id="home">
        <h1>Welcome to Blood Group Detection</h1>
        <p>Effortless blood group detection using fingerprint analysis.</p>
        <a href="index.html"><button class="btn">Get Started</button></a>
    </div>

</body>
</html>
